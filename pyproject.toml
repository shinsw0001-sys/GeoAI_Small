# 저장소 공통 개발 도구 설정. 패키지는 libs/, agents/ 아래에 각각 있다.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "libs/geoai-common/tests",
    "agents/studio-agent/tests",
    "agents/specialist-agents/tests",
    "console/ops-console/tests",
    "tools/geoai-tools/tests",
    "tests",
]
markers = [
    "integration: PostgreSQL·NATS 가 필요한 통합 시험 (GEOAI_TEST_DATABASE_URL, GEOAI_TEST_NATS_URL)",
    "e2e: 처리 도구(PyTorch)까지 실제로 돌리는 종단 시험",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]
