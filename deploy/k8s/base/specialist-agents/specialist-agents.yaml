# 전문 에이전트 4종: 같은 이미지, GEOAI_AGENT_ID 로 역할을 정한다. 상태를 두지 않는다.
# 연산은 하지 않고 geoai-jobs 네임스페이스에 실행 작업(쿠버네티스 Job)을 만들어 처리 도구 이미지로 돌린다.
# 그래서 서비스 계정 토큰을 붙이고(automountServiceAccountToken: true), Job 생성 권한만 준다(jobs/jobs.yaml).
# 비밀(Secret) geoai-agents 는 오버레이가 만든다 (키: database-url, s3-access-key, s3-secret-key).
# 처리 도구 이미지 주소(GEOAI_TOOLS_IMAGE)는 환경 변수라 images 변환이 닿지 않으므로 onprem 오버레이에서 덮어쓴다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geo-data-production-agent
  namespace: geoai
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-data-production-agent
  namespace: geoai
  labels: {app.kubernetes.io/name: geo-data-production-agent, app.kubernetes.io/part-of: geoai, app.kubernetes.io/component: agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: geo-data-production-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: geo-data-production-agent, app.kubernetes.io/part-of: geoai, app.kubernetes.io/component: agent}
    spec:
      serviceAccountName: geo-data-production-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: geoai/specialist-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: GEOAI_AGENT_ID, value: geo-data-production-agent}
            - {name: GEOAI_ONTOLOGY_DIR, value: /app/ontology}
            - {name: GEOAI_DOMAIN_DIRS, value: /app/domains}
            - {name: GEOAI_NATS_URL, value: "nats://nats.geoai.svc.cluster.local:4222"}
            - name: GEOAI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: geoai-agents, key: database-url}}
            - {name: GEOAI_S3_ENDPOINT, value: "http://object-store.geoai-data.svc.cluster.local:8333"}
            - name: GEOAI_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: geoai-agents, key: s3-access-key}}
            - name: GEOAI_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: geoai-agents, key: s3-secret-key}}
            - {name: GEOAI_JOB_RUNNER, value: kubernetes}
            - {name: GEOAI_JOB_NAMESPACE, value: geoai-jobs}
            - {name: GEOAI_TOOLS_IMAGE, value: "geoai/geoai-tools:0.1.0"}
            - {name: GEOAI_JOB_GPU, value: "true"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: domains, mountPath: /app/domains, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: domains
          configMap: {name: geoai-domains}
        - name: tmp
          emptyDir: {}
---
