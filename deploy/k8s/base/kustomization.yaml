# GeoAI Studio + 공통 데이터·실행 기반 배포 골격 (Kustomize base)
# 비밀(Secret)과 분야 온톨로지는 환경마다 다르므로 오버레이에서 넣는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces/namespaces.yaml
  - nats/nats.yaml
  - postgres/postgres.yaml
  - object-store/object-store.yaml
  - studio-agent/studio-agent.yaml
  - specialist-agents/specialist-agents.yaml
  - jobs/jobs.yaml
  - ops-console/ops-console.yaml
labels:
  - pairs: {app.kubernetes.io/version: "0.1.0"}
    includeSelectors: false
