# 공통 통신: NATS JetStream 메시지 브로커 (작업·이벤트 전달)
# 스트림 GEOAI(geoai.>)는 에이전트가 기동할 때 만든다. 단일 노드 골격이며, 운영 확장 시 3노드 클러스터로 바꾼다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: geoai
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    server_name: $POD_NAME
    jetstream {
      store_dir: /data
      max_file_store: 10G
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: geoai
  labels: {app.kubernetes.io/name: nats}
spec:
  selector: {app.kubernetes.io/name: nats}
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: geoai
  labels: {app.kubernetes.io/name: nats, app.kubernetes.io/part-of: geoai}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nats}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nats, app.kubernetes.io/part-of: geoai}
    spec:
      containers:
        - name: nats
          image: nats:2.10.22-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: nats-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
