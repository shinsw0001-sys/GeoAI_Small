# 운영 콘솔: 1년차 Studio Agent 상위 발신자. 화면과 화면용 응용 프로그램 인터페이스를 한 컨테이너에서 제공한다.
# Studio Agent 는 HTTP 로, 산출물은 데이터·모델 저장소(S3)로 읽는다. 상태를 두지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-console
  namespace: geoai
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: geoai
  labels: {app.kubernetes.io/name: ops-console}
spec:
  selector: {app.kubernetes.io/name: ops-console}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: geoai
  labels: {app.kubernetes.io/name: ops-console, app.kubernetes.io/part-of: geoai, app.kubernetes.io/component: console}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ops-console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ops-console, app.kubernetes.io/part-of: geoai, app.kubernetes.io/component: console}
    spec:
      serviceAccountName: ops-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ops-console
          image: geoai/ops-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: GEOAI_STUDIO_URL, value: "http://studio-agent.geoai.svc.cluster.local"}
            - {name: GEOAI_S3_ENDPOINT, value: "http://object-store.geoai-data.svc.cluster.local:8333"}
            - name: GEOAI_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: geoai-agents, key: s3-access-key}}
            - name: GEOAI_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: geoai-agents, key: s3-secret-key}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
