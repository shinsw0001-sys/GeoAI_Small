[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoai-tools"
version = "0.1.0"
description = "GeoAI 처리 도구: 실행 작업(정사영상 수집·정합, 타일 분할, 라벨 래스터화, 분할 모델 학습·성능 검증)을 수행한다. 작업 실행 엔진이 컨테이너로 실행한다."
requires-python = ">=3.12"
dependencies = [
    "geoai-common[s3]==0.1.0",
    "numpy==2.5.4",
    "rasterio==1.5.2",
    "shapely==2.2.0",
    "torch==2.15.0",
    "laspy==2.7.0",
]

[project.scripts]
geoai-tools = "geoai_tools.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoai_tools"]
